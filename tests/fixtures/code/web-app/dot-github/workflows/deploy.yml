name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.BITBUCKET_DEPLOY_KEY }}
      - name: Fetch shared config
        run: |
          ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts
          git clone --depth 1 git@bitbucket.org:acme-demo/shared-config.git config
      - name: Docs (HTTPS, unaffected)
        run: curl -fsSL https://bitbucket.org/acme-demo/docs/raw/main/README.md
