[package]
name = "bbhost-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find Git-over-SSH uses of bitbucket.org (remotes, submodules, ~/.ssh/config, known_hosts, CI, lockfiles) and rewrite them to ssh.bitbucket.org before the Bitbucket Cloud SSH host change"
license = "MIT"
repository = "https://github.com/majiayu000/bbhost-check"
readme = "README.md"
keywords = ["bitbucket", "ssh", "git", "migration", "known-hosts"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
